<!doctype html>
<html lang="zh-CN"
  ><head
    ><meta charset="UTF-8" /><meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    /><title>Brevia · 左侧引导动效预览</title
    ><script src="left-stories.js"></script
    ><style>
      *{box-sizing:border-box}body{margin:0;padding:20px;background:#eceef1;color:#202124;font-family:system-ui,sans-serif}main{max-width:1280px;margin:0 auto}.frame{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 12px 36px #20212412}iframe{width:1280px;height:800px;border:0;transform-origin:0 0}.tabs,.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}button,select{min-height:38px;padding:8px 13px;border:1px solid #d2d6dc;border-radius:8px;background:#fff;color:#202124;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#202124;color:#fff;border-color:#202124}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #202124;outline-offset:3px}input{accent-color:#202124;flex:1;min-width:100px}output{font-size:13px;font-variant-numeric:tabular-nums;min-width:115px}p{margin:10px 0;color:#5f6772;font-size:13px;line-height:1.7}#event{color:#303640}#scene-select{max-width:100%}@media(max-width:600px){body{padding:10px}.tabs button{flex:1}.controls{gap:7px}output{width:100%}}
    </style></head
  ><body
    ><main>
      <div class="tabs" aria-label="预览入口"
        ><button data-preview="language" aria-pressed="true">语言</button
        ><button data-preview="permissions" aria-pressed="false">权限</button
        ><button data-preview="setup" aria-pressed="false">模型与存储</button
        ><button data-preview="ai" aria-pressed="false">AI 功能</button
        ><button data-preview="phone" aria-pressed="false">手机连接</button
        ><button data-preview="original" aria-pressed="false">原 9 秒能力预览</button
        ><select id="preview-locale" aria-label="动画语言"
          ><option value="zh">简体中文</option
          ><option value="en">English</option
          ><option value="es">Español</option
          ><option value="ja">日本語</option
          ><option value="ko">한국어</option
          ><option value="fr">Français</option
          ><option value="de">Deutsch</option
          ><option value="ru">Русский</option></select
        ></div
      >
      <div class="frame"
        ><iframe
          id="composition"
          src="language-left.html"
          title="Brevia 左侧引导动效，右侧原页保持不变"
          scrolling="no"
        ></iframe
      ></div>
      <div class="controls"
        ><button id="toggle" disabled>播放本段</button><button id="replay" disabled>重播本段</button
        ><select id="scene-select" aria-label="选择左侧演示模式"></select
        ><select id="end-mode" aria-label="当前段播放结束行为"
          ><option value="pause">播完暂停</option
          ><option value="loop" selected>本段循环</option></select
        ></div
      >
      <div class="controls"
        ><input
          id="time"
          type="range"
          min="0"
          max="9"
          step="0.01"
          value="0"
          aria-label="演示时间（秒）"
        /><output id="position" for="time">0.00 / 9.00s</output></div
      >
      <p id="event" role="status"></p
      ><p id="scope">左侧演示模式，不修改右侧当前配置。五个步骤均可切换、播放和回看。</p
      ><p
        >设计预览；五步共用三画面轮播已接入应用。演示不保存配置、不调用
        AI、不录音、不连接设备。时间轴为演示节奏，实际处理耗时以服务响应为准。</p
      > </main
    ><script>
      const stories={...window.BREVIA_LEFT_STORIES,original:{file:'index.html',duration:9,segments:[{id:'original',label:'原 9 秒能力预览',start:0,end:9}],events:[{at:0,label:'声音 → 文字 → 纪要'}]}};
      const frame=document.querySelector('.frame'),composition=document.getElementById('composition'),toggle=document.getElementById('toggle'),replay=document.getElementById('replay'),slider=document.getElementById('time'),position=document.getElementById('position'),select=document.getElementById('scene-select'),eventLabel=document.getElementById('event');
      let kind='language',story=stories.language,segment=story.segments[0],playing=false,ready=false;
      const send=(action,time)=>composition.contentWindow.postMessage({source:'brevia-player',action,time},'*');
      const setPlaying=value=>{playing=value;toggle.textContent=value?'暂停':'播放本段'};
      function renderSelect(){select.innerHTML=story.segments.map(item=>`<option value="${item.id}">${item.label} · ${Number((item.end-item.start).toFixed(2))}s</option>`).join('');select.value=segment.id;slider.max=story.duration;position.textContent=`${Number(slider.value).toFixed(2)} / ${story.duration.toFixed(2)}s`}
      function play(){if(Number(slider.value)<segment.start||Number(slider.value)>=segment.end-.025)send('seek',segment.start+(kind==='original'?.2:0));setPlaying(true);send('play')}
      new ResizeObserver(()=>{composition.style.transform=`scale(${frame.clientWidth/1280})`}).observe(frame);
      window.addEventListener('message',event=>{
       if(event.source!==composition.contentWindow||event.data?.source!=='brevia-motion')return;
       if(event.data.interaction)setPlaying(!event.data.paused);
       if(event.data.ready){ready=true;toggle.disabled=replay.disabled=false;send('seek',segment.start+(kind==='original'?.2:0));if(!matchMedia('(prefers-reduced-motion: reduce)').matches)play()}
       if(Number.isFinite(event.data.time)){
        const time=event.data.time;slider.value=time;position.textContent=`${time.toFixed(2)} / ${story.duration.toFixed(2)}s`;
        const item=[...story.events].reverse().find(item=>item.at<=time)||story.events[0];eventLabel.textContent=item.label;
        if(playing&&time>=segment.end-.025){send('pause');if(document.getElementById('end-mode').value==='loop'){send('seek',segment.start+(kind==='original'?.2:0));send('play')}else{setPlaying(false);send('seek',segment.end-.04)}}
       }
      });
      toggle.addEventListener('click',()=>{if(playing){setPlaying(false);send('pause')}else play()});
      replay.addEventListener('click',()=>{send('seek',segment.start+(kind==='original'?.2:0));play()});
      select.addEventListener('change',()=>{segment=story.segments.find(item=>item.id===select.value);setPlaying(false);send('seek',segment.start+.65)});
      slider.addEventListener('input',()=>{setPlaying(false);const time=Number(slider.value);segment=story.segments.find(item=>item.id!=='all'&&time>=item.start&&time<item.end)||story.segments[0];select.value=segment.id;send('seek',time)});
      document.querySelector('.tabs').addEventListener('click',event=>{const next=event.target.dataset.preview;if(!next)return;setPlaying(false);ready=false;toggle.disabled=replay.disabled=true;kind=next;story=stories[kind];segment=story.segments[0];slider.value=0;renderSelect();for(const button of document.querySelectorAll('[data-preview]'))button.setAttribute('aria-pressed',String(button.dataset.preview===kind));document.getElementById('scope').textContent=kind==='original'?'原 9 秒能力预览保留。':`左侧演示模式，不修改右侧当前配置。当前步骤左侧按当前段播放，段尾暂停或独立循环。`;composition.src=story.file+(kind==='original'?'':'?lang='+document.getElementById('preview-locale').value)});
      document.getElementById('preview-locale').addEventListener('change',()=>{if(kind==='original')return;setPlaying(false);ready=false;toggle.disabled=replay.disabled=true;composition.src=story.file+'?lang='+document.getElementById('preview-locale').value});
      renderSelect();
    </script></body
  ></html
>
